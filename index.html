const fmt=n=>'$'+Math.round(n).toLocaleString('es-CL');let hist=JSON.parse(localStorage.getItem('petaca_history')||'[]');let cart=[];let next=hist.reduce((m,o)=>Math.max(m,Number(o.number)||0),0)+1;const $=id=>document.getElementById(id);$('num').textContent=next;
function renderProducts(){let q=$('search').value.toLowerCase();let a=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)).slice(0,200);$('products').innerHTML=a.map((p,i)=>`<div class="prod"><div><b>${esc(p.name)}</b><div class="price">${fmt(p.price)}</div></div><button class="add" data-i="${PRODUCTS.indexOf(p)}">+ Agregar</button></div>`).join('')||'<div class="empty">No se encontraron productos</div>';document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(Number(b.dataset.i)))}
function add(i){let p=PRODUCTS[i],x=cart.find(x=>x.name===p.name);if(x)x.qty++;else cart.push({name:p.name,price:p.price,qty:1});renderCart()}
function renderCart(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);$('empty').style.display=cart.length?'none':'block';$('cart').innerHTML=cart.map((x,i)=>`<div class="cartrow"><div><b>${esc(x.name)}</b><div class="small">${fmt(x.price)} c/u</div></div><div class="qty"><button onclick="change(${i},-1)">−</button><b>${x.qty}</b><button onclick="change(${i},1)">+</button></div><b>${fmt(x.price*x.qty)}</b></div>`).join('');$('total').textContent=fmt(total)}
function change(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function save(){if(!cart.length){alert('Agrega productos a la comanda.');return}let now=new Date(),o={number:next,date:now.toLocaleDateString('es-CL'),time:now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),client:$('client').value.trim()||'Cliente',items:cart.map(x=>({...x})),total:cart.reduce((s,x)=>s+x.price*x.qty,0)};hist.push(o);localStorage.setItem('petaca_history',JSON.stringify(hist));print(o);next++;cart=[];$('client').value='';$('num').textContent=next;renderCart();renderHistory()}

rrow{display:grid;grid-template-columns:10mm 1fr 17mm 18mm;gap:1mm;font-size:10px;padding:4px 0;border-bottom:1px dashed #777}.tot{display:flex;justify-content:space-between;background:#111;color:#fff;padding:9px;font-size:18px;font-weight:900;margin-top:8px}.thanks{text-align:center;background:#111;color:#fff;padding:9px;margin-top:10px;font-weight:900}.stars{text-align:center;font-size:23px;margin:7px}.foot{text-align:center;border-top:2px solid #111;margin-top:8px;padding-top:7px;font-size:10px}.del{text-align:center;background:#111;color:#fff;padding:7px;margin-top:7px;font-weight:900}@media print{body{background:#fff}.toolbar{display:none}.receipt{margin:0;width:80mm}}</style></head><body><div class="toolbar"><button onclick="window.print()">🖨️ IMPRIMIR / AIRPRINT</button></div>${receipt}<script>window.onload=function(){setTimeout(function(){window.scrollTo(0,0)},100)}<\/script></body></html>`);w.document.close()}
function renderHistory(){let q=$('hsearch').value.toLowerCase();let a=hist.slice().reverse().filter(o=>!q||String(o.number).includes(q)||o.client.toLowerCase().includes(q));$('history').innerHTML=a.length?a.map(o=>`<div class="historyrow"><div class="line"><b>Comanda #${o.number}</b><b>${fmt(o.total)}</b></div><div class="small">${o.date} · ${o.time} · ${esc(o.client)}</div><button class="secondary" style="margin-top:8px" onclick='reprint(${JSON.stringify(o).replace(/'/g,"&#39;")})'>🖨️ Reimprimir</button></div>`).join(''):'<div class="empty">No hay comandas guardadas.</div>'}
function reprint(o){print(o)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
